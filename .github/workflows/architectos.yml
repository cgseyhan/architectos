name: ArchitectOS Governance Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  architectos-review:
    name: ArchitectOS Repository Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ArchitectOS Health Review
        run: |
          npx -y architectos review --threshold 80
